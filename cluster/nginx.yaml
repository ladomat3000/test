apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: default
spec:
  interval: 1m0s
  url: https://charts.bitnami.com/bitnami
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: default
spec:
  chart:
    chart: nginx
    version: ">=15.0.0"
  sourceRef:
    kind: HelmRepository
    name: bitnami
  interval: 10m
  releaseName: nginx
  values:
    replicaCount: 3
